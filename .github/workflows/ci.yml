# Android CI: the pre-merge verify gate. Runs on every push/PR.
# NO release keystore in CI — release builds are signed locally and the
# build.gradle.kts guard pins the canonical key. Read-only token, pinned majors.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Compile instrumented tests (#96 — catches an androidTest dependency bump, no emulator needed)
        run: ./gradlew assembleDebugAndroidTest
      - name: Static analysis (detekt)
        run: ./gradlew detekt
      - name: Translations (EN/FR parity — MissingTranslation lint, #52)
        run: ./gradlew lintDebug
      - name: Leak scan (household infra must never ship)
        run: |
          # #404: a missing terms file makes `grep -f` exit 2, the `if` below
          # false, and the step green having scanned nothing — fail-open.
          [ -s dev/forbidden-terms.txt ] || { echo "::error::dev/forbidden-terms.txt missing or empty"; exit 1; }
          if git ls-files | xargs grep -InE -f dev/forbidden-terms.txt \
               | grep -viE "\.lock$|^dev/forbidden-terms\.txt:"; then
            echo "::error::forbidden term(s) found above"; exit 1
          fi
      - name: Secret scan
        # Binary download rather than gitleaks-action: the org Actions policy
        # only allows GitHub-owned + verified-creator actions.
        run: |
          v=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner .
      - name: REUSE lint (per-file SPDX licensing, #50)
        # Python tool; the org Actions policy blocks fsfe/reuse-action, so run it
        # via pipx (preinstalled on the runner). The charset-normalizer extra
        # supplies reuse's encoding detection without needing libmagic.
        run: pipx run --spec 'reuse[charset-normalizer]' reuse lint

  # #79: runs the androidTest suite (this repo's only test source set — see
  # #99) on a real emulator. #96/#97 got CI as far as compiling it; nothing
  # executed it, so a regression in e.g. TokenCrypto's round-trip or
  # SyncEngine's path walk still passed a green PR. This closes that gap.
  #
  # Deliberately its own job/check name, NOT folded into `build` above, and
  # NOT added to protect-main's required_status_checks (currently just
  # `build` + `require-label`): an emulator flake must not block an
  # unrelated merge before this has proven stable over a few PRs. Flip it to
  # required by hand once it has (see #79's own phasing note).
  #
  # No `uses: reactivecircus/android-emulator-runner` — same org Actions
  # policy (GitHub-owned + verified-creator only) that made the `build` job
  # above fetch gitleaks as a plain binary and run REUSE via pipx. Every
  # step here is either a GitHub-owned action already used above/actions/cache,
  # or a plain `run:` driving the Android SDK's own command-line tools —
  # `sdkmanager`/`avdmanager`/`emulator` are all preinstalled on the hosted
  # runner image (Ubuntu's Android Command Line Tools), just not the
  # emulator package or a system image, which is what this job fetches.
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM (hardware-accelerated emulation on the hosted runner)
        # Standard udev-rule grant for /dev/kvm — hosted ubuntu-latest runners
        # have nested virtualization enabled but the default node permissions
        # don't let the runner user touch it. Without this the emulator falls
        # back to pure software emulation, which is slow enough to blow the
        # job's timeout rather than just being somewhat slower.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Cache the emulator package, system image, and created AVD
        # #79's own caveat: cache the AVD/snapshot to keep boot time
        # reasonable. Static key (not hashFiles(ci.yml)) deliberately — an
        # unrelated edit to this file shouldn't cost the next PR a cold
        # ~1GB re-download; bump the "v1" by hand if the AVD definition
        # below ever changes. First-writer-wins (actions/cache never
        # overwrites an existing key), so the "quit the emulator cleanly"
        # step below matters: it's what lets that first run's boot snapshot
        # actually land in the cache for every run after it to reuse.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Hardcoded, not ${{ env.ANDROID_HOME }}: that's a shell env var
          # baked into the runner image, not something the workflow's own
          # `env:` context (used to resolve `${{ }}` expressions) sees —
          # it would silently resolve empty here. Confirmed against
          # actions/runner-images' Ubuntu 24.04 readme.
          path: |
            ~/.android/avd
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
          key: android-avd-api34-x86_64-v1
      - name: Install the emulator package + API 34 x86_64 system image
        # Idempotent regardless of the cache step's hit/miss: a cache hit
        # means these already exist and sdkmanager no-ops; a miss (or a
        # partially-evicted cache) means it fetches what's missing.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "emulator" "system-images;android-34;default;x86_64"
      - name: Create the AVD
        # Same API level + device profile as the local `trobar_test` AVD
        # developers run this suite against manually.
        run: |
          if [ ! -d ~/.android/avd/ci_test.avd ]; then
            echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
              -n ci_test -k "system-images;android-34;default;x86_64" -d pixel_6
          fi
      - name: Boot the emulator (headless)
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd ci_test -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -camera-back none &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          # boot_completed can read true before the system is actually ready
          # to accept the instrumentation package, so poll rather than trust
          # the first true.
          timeout 180 bash -c '
            until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 2
            done'
      - name: Run instrumented tests
        run: ./gradlew connectedDebugAndroidTest
      - name: Upload instrumented test results (debugging a failure/flake)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: androidTest-results
          path: app/build/outputs/androidTest-results/connected
          retention-days: 7
          if-no-files-found: ignore
      - name: Quit the emulator cleanly (lets it save a boot snapshot for the cache above)
        if: always()
        run: $ANDROID_HOME/platform-tools/adb emu kill || true
