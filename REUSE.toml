# REUSE (https://reuse.software) licensing for files that can't carry an inline
# SPDX header — binaries, fonts, and the vendored Gradle wrapper (#50). First-
# party source files carry their own header instead.
version = 1

# --- Brand fonts (OFL-1.1, upstream authors) -------------------------------
[[annotations]]
path = ["app/src/main/res/font/fredoka_semibold.ttf", "app/src/main/res/font/fredoka_bold.ttf"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Fredoka Project Authors (https://github.com/hafontia/Fredoka-One)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "app/src/main/res/font/space_grotesk_regular.ttf",
  "app/src/main/res/font/space_grotesk_medium.ttf",
  "app/src/main/res/font/space_grotesk_semibold.ttf",
  "app/src/main/res/font/space_grotesk_bold.ttf",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 The Space Grotesk Project Authors (https://github.com/floriankarsten/space-grotesk)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["app/src/main/res/font/space_mono_regular.ttf", "app/src/main/res/font/space_mono_bold.ttf"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Space Mono Project Authors (https://github.com/googlefonts/spacemono)"
SPDX-License-Identifier = "OFL-1.1"

# --- First-party brand artwork / icons -------------------------------------
[[annotations]]
path = "fastlane/metadata/android/en-US/images/icon.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- README screenshots (#22): captured against the synthetic dev library ---
[[annotations]]
path = "docs/screenshots/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- .gitignore, renovate.json (no header / no comment syntax) -------------
[[annotations]]
path = [".gitignore", "renovate.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- dev/forbidden-terms.txt carries its own comment header explaining the
# format; an SPDX block on top would outweigh a body of two regexes ---------
[[annotations]]
path = "dev/forbidden-terms.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Vendored Gradle wrapper (third-party, Apache-2.0 © Gradle) ------------
[[annotations]]
path = [
  "gradlew",
  "gradlew.bat",
  "gradle/wrapper/gradle-wrapper.jar",
  "gradle/wrapper/gradle-wrapper.properties",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

# --- Brand theme tokens (JSON has no comment syntax): a copy of
# trobar-server's brand/tokens/trobar-themes.json ----------------------------
[[annotations]]
path = "brand/trobar-themes.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- The single-colour mark, generated by dev/gen_mono_mark.py; kept as a
# one-line SVG for the other clients to copy -----------------------------------
[[annotations]]
path = "brand/trobar-mark-mono.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Gradle dependency lockfiles: generated, rewritten by --write-locks -----
[[annotations]]
path = ["app/gradle.lockfile", "freedroidwarn/gradle.lockfile", "buildscript-gradle.lockfile"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "CC0-1.0"

# --- Store listing texts (Fastlane): plain text read as-is, no room for a header
[[annotations]]
path = "fastlane/metadata/android/**/*.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- FreeDroidWarn, vendored from upstream V1.14 (freedroidwarn/UPSTREAM.md) ---
[[annotations]]
path = ["freedroidwarn/src/main/java/**", "freedroidwarn/src/main/res/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "woheller69 (https://github.com/woheller69/FreeDroidWarn)"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "freedroidwarn/src/main/AndroidManifest.xml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 missing-foss"
SPDX-License-Identifier = "GPL-3.0-or-later"
